# Roda o pipeline inteiro numa máquina limpa do GitHub e guarda o dashboard como artefato para baixar.
# Só dispara à mão (aba Actions, "Run workflow"); não publica nada sozinho. Como a máquina começa sem
# data/, a ingestão baixa o histórico completo do INEGI, e isso leva uns 5 minutos. Se a validação
# falhar, o run_pipeline.py sai com erro, o job fica vermelho e o dashboard não é gerado; o validacao.json,
# quando existe, sobe mesmo assim para eu ver o que falhou.

name: Atualizar dashboard do INPC

on:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o pipeline
        run: python run_pipeline.py

      - name: Publicar o dashboard como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dashboard_inpc
          path: output/dashboard_inpc.html
          if-no-files-found: error

      - name: Guardar o relatório da validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao
          path: data/processed/validacao.json
          if-no-files-found: ignore
